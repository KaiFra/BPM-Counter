name: bpmcounter
description: "A black/green BPM counter: tap along or let the microphone detect the tempo."
publish_to: 'none'

# The release workflow overrides this with the version from the git tag.
version: 2.0.0+20000

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  # Raw PCM stream from the microphone. Adds only RECORD_AUDIO to the manifest.
  record: ^7.1.2
  # Remembers the filter settings between launches (local storage only).
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
