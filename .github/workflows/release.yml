name: Release

# Push a tag like v2.1.0 to build, sign and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

env:
  FLUTTER_VERSION: "3.47.7"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be below 100"; exit 1
          fi
          # Monotonic Android versionCode: 2.1.3 -> 20103
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::No signing key configured, the APK is signed with a debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "BPM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "BPM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BPM_KEY_ALIAS=$KEY_ALIAS"
            echo "BPM_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/bpm-counter-${{ steps.version.outputs.name }}.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Check permissions
        run: tool/check_apk_permissions.sh dist/bpm-counter-${{ steps.version.outputs.name }}.apk

      - name: Check ABI and report size
        run: tool/check_apk_abi.sh dist/bpm-counter-${{ steps.version.outputs.name }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: BPM Counter ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          body: |
            Download **bpm-counter-${{ steps.version.outputs.name }}.apk** below and open it on your
            phone to install (64-bit phone with Android 8.0 or newer, built for Android 17).
            See the [README](https://github.com/${{ github.repository }}#install) for details.
            ${{ steps.signing.outputs.signed != 'true' && '> ⚠️ Signed with a temporary debug key. Updates from future, properly signed releases will require uninstalling this version first.' || '' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
