name: Release

# Builds, signs and publishes a GitHub release. Two ways to start it:
# - Actions -> Release -> Run workflow, enter a version like 2.1.0. The workflow
#   creates the tag v2.1.0 on the default branch when it publishes the release.
# - Push a tag like v2.1.0.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.1.0 (creates the tag v2.1.0)"
        required: true
        type: string

env:
  FLUTTER_VERSION: "3.47.7"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Releases are only made from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"; exit 1
            fi
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be below 100"; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] \
              && [[ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]]; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          # Monotonic Android versionCode: 2.1.3 -> 20103
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::No signing key configured, the APK is signed with a debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "BPM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "BPM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BPM_KEY_ALIAS=$KEY_ALIAS"
            echo "BPM_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/bpm-counter-${{ steps.version.outputs.name }}.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Check permissions
        run: tool/check_apk_permissions.sh dist/bpm-counter-${{ steps.version.outputs.name }}.apk

      - name: Check ABI and report size
        run: tool/check_apk_abi.sh dist/bpm-counter-${{ steps.version.outputs.name }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on the built commit if it does not exist yet (Run workflow).
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BPM Counter ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          body: |
            Download **bpm-counter-${{ steps.version.outputs.name }}.apk** below and open it on your
            phone to install (64-bit phone with Android 8.0 or newer, built for Android 17).
            See the [README](https://github.com/${{ github.repository }}#install) for details.
            ${{ steps.signing.outputs.signed != 'true' && '> ⚠️ Signed with a temporary debug key. Updates from future, properly signed releases will require uninstalling this version first.' || '' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
